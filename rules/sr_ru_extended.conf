# Shadowrocket extension: generated and validated by shadowrocket_pipeline.
# Canonical source: https://github.com/jeerom/shadowrocket-rules (main).
# First-match order is intentional. Torrent safeguards must remain first.

[General]
update-url = https://raw.githubusercontent.com/jeerom/shadowrocket-rules/main/rules/sr_ru_extended.conf

[Rule]
# Best-effort torrent guard: known HTTP User-Agent and common destination ports.
USER-AGENT,*BitTorrent*,DIRECT
USER-AGENT,*libtorrent*,DIRECT
USER-AGENT,*qBittorrent*,DIRECT
USER-AGENT,*Transmission*,DIRECT
USER-AGENT,*uTorrent*,DIRECT
DST-PORT,6881,DIRECT
DST-PORT,6882,DIRECT
DST-PORT,6883,DIRECT
DST-PORT,6884,DIRECT
DST-PORT,6885,DIRECT
DST-PORT,6886,DIRECT
DST-PORT,6887,DIRECT
DST-PORT,6888,DIRECT
DST-PORT,6889,DIRECT
DST-PORT,6969,DIRECT
DST-PORT,51413,DIRECT

# Canonical rebuilt rule sets. Later sets contain no rule shadowed by an earlier set.
RULE-SET,https://raw.githubusercontent.com/jeerom/shadowrocket-rules/main/rules/sr_ru_direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/jeerom/shadowrocket-rules/main/rules/sr_ru_proxy.list,PROXY
RULE-SET,https://raw.githubusercontent.com/jeerom/shadowrocket-rules/main/rules/sr_ru_reject.list,REJECT
